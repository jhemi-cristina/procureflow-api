
services:
  postgres:
    image: postgres:17
    container_name: procureflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-procureflow}
      POSTGRES_USER: ${DB_USERNAME:-procureflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Configure DB_PASSWORD no .env}    ports:- "5432:5432"
    volumes:
      - procureflow_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U procureflow -d procureflow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  procureflow_data:
